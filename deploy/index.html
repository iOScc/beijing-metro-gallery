<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北京地铁照片馆 · 按线路看风景</title>
<style>
/* SECTION: base */
:root{
  --bg:#0f1216; --bg-2:#161b22; --card:#1c222b; --line:#2b333f;
  --ink:#eef2f7; --ink-2:#a4b0bf; --ink-3:#6f7d8e;
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%, #1d2735 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #1b2230 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* SECTION: header */
.hero{padding:clamp(26px,5vw,52px) clamp(16px,4vw,40px) 18px;max-width:1280px;margin:0 auto}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{
  width:46px;height:46px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,#E4002B 0%,#0067B0 100%);
  display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:-.5px;
  box-shadow:0 6px 18px rgba(228,0,43,.28);
}
h1{margin:0;font-size:clamp(24px,3.6vw,38px);letter-spacing:.5px}
.sub{margin:12px 0 0;color:var(--ink-2);font-size:clamp(13.5px,1.5vw,15.5px);line-height:1.7;max-width:76ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{
  background:var(--bg-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--ink-2)
}
.stat b{color:var(--ink);font-size:13.5px;font-weight:700;margin-right:5px}

/* SECTION: toolbar */
.toolbar{
  max-width:1280px;margin:0 auto;padding:6px clamp(16px,4vw,40px) 0;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap
}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search input{
  width:100%;padding:11px 14px 11px 38px;border-radius:12px;
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink);font-size:14px;outline:none
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:#41506a;box-shadow:0 0 0 3px rgba(65,80,106,.18)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:9px 15px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);
  font-size:13px;color:var(--ink-2);transition:.18s
}
.chip:hover{color:var(--ink);border-color:#41506a}
.chip.on{background:#e9eef6;color:#111820;border-color:#e9eef6;font-weight:600}

/* SECTION: line nav */
.nav-wrap{max-width:1280px;margin:0 auto;padding:20px clamp(16px,4vw,40px) 4px}
.nav-label{font-size:12.5px;color:var(--ink-3);letter-spacing:1.6px;margin:0 2px 12px;text-transform:uppercase}
.lines{display:flex;gap:10px;flex-wrap:wrap}
.line-btn{
  --c:#888;position:relative;display:flex;align-items:center;gap:8px;
  padding:8px 15px 8px 9px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);
  font-size:14px;font-weight:600;letter-spacing:.3px;transition:transform .16s,border-color .16s,background .16s
}
.line-btn:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.line-btn .badge{
  min-width:26px;height:26px;padding:0 7px;border-radius:8px;background:var(--c);
  color:var(--badge-ink,#fff);display:grid;place-items:center;font-size:12.5px;font-weight:800
}
.line-btn .n{font-size:11.5px;font-weight:600;color:var(--ink-3);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:999px}
.line-btn.on{background:color-mix(in srgb,var(--c) 20%,var(--bg-2));border-color:var(--c);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 26%,transparent)}
.line-btn.on .n{color:var(--ink);background:color-mix(in srgb,var(--c) 30%,transparent)}

/* SECTION: gallery */
.stage{max-width:1280px;margin:0 auto;padding:clamp(20px,3.5vw,34px) clamp(16px,4vw,40px) 40px}
.line-head{display:flex;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:6px}
.line-head .rule{height:5px;width:74px;border-radius:999px;margin-top:11px}
.line-head h2{margin:0;font-size:clamp(20px,2.6vw,27px)}
.line-head .kind{
  font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-top:6px;align-self:flex-start
}
.brief{margin:10px 0 22px;color:var(--ink-2);font-size:14.5px;line-height:1.75;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:zoom-in;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#3d4859}
.card:focus-visible{outline:2px solid #7ea2ff;outline-offset:2px}
.shot{position:relative;aspect-ratio:4/3;background:linear-gradient(140deg,#232c38,#1a2028)}
.shot img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.shot img.ready{opacity:1}
.shot .fallback{
  position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;
  color:var(--ink-3);font-size:13px;line-height:1.6;background:linear-gradient(140deg,#252f3c,#1a2028)
}
.shot.failed img{display:none}
.shot.failed .fallback{display:grid}
.shot .tag{
  position:absolute;left:11px;top:11px;background:var(--c,#000);color:#fff;font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:8px;letter-spacing:.4px;box-shadow:0 3px 10px rgba(0,0,0,.3)
}
.cap{padding:12px 14px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cap .t{font-size:14px;font-weight:600;line-height:1.45}
.cap .s{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.empty{
  border:1px dashed var(--line);border-radius:var(--radius);padding:42px 24px;text-align:center;color:var(--ink-2)
}
.empty h3{margin:0 0 8px;font-size:17px;color:var(--ink)}
.empty p{margin:0;font-size:13.5px;line-height:1.7}

/* SECTION: lightbox */
.lb{
  position:fixed;inset:0;background:rgba(8,10,14,.92);backdrop-filter:blur(6px);
  display:none;place-items:center;z-index:50;padding:20px
}
.lb.open{display:grid}
.lb-inner{max-width:1080px;width:100%;display:flex;flex-direction:column;gap:14px}
.lb-img{
  width:100%;max-height:74vh;object-fit:contain;border-radius:14px;background:#12171e;
  border:1px solid #2b333f
}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lb-meta{display:flex;align-items:center;gap:11px;min-width:0}
.lb-meta .dot{width:14px;height:14px;border-radius:5px;flex:0 0 auto}
.lb-meta .l{font-size:13.5px;font-weight:700}
.lb-meta .c{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-act{display:flex;gap:8px;align-items:center}
.lb-btn{
  width:40px;height:40px;border-radius:11px;background:#1d242e;border:1px solid var(--line);
  display:grid;place-items:center;transition:.16s
}
.lb-btn:hover{background:#28303c}
.lb-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2}
.lb-count{font-size:12.5px;color:var(--ink-3);margin-right:4px}

/* SECTION: footer */
.foot{
  max-width:1280px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 46px;
  border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;line-height:1.85
}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .cap{padding:9px 10px 10px;flex-direction:column;align-items:flex-start;gap:3px}
  .cap .s{font-size:10.5px}
  .line-btn{font-size:13px;padding:6px 12px 6px 7px}
  .line-btn .badge{min-width:23px;height:23px;font-size:11.5px}
  .lb-img{max-height:56vh}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div class="mark" aria-hidden="true">M</div>
    <h1>北京地铁照片馆</h1>
  </div>
  <p class="sub">点一条线路，看它的车站与列车。线路按钮用的是各条线的官方标志色，照片来自公开网络素材。</p>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="搜线路，如 8号线 / 环线 / 机场" autocomplete="off">
  </label>
  <div class="filters" id="filters"></div>
</div>

<nav class="nav-wrap" aria-label="线路选择">
  <p class="nav-label">SELECT A LINE</p>
  <div class="lines" id="lines"></div>
</nav>

<main class="stage" id="stage" aria-live="polite"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片查看">
  <div class="lb-inner">
    <img class="lb-img" id="lbImg" alt="">
    <div class="lb-bar">
      <div class="lb-meta">
        <span class="dot" id="lbDot"></span>
        <span class="l" id="lbLine"></span>
        <span class="c" id="lbCap"></span>
      </div>
      <div class="lb-act">
        <span class="lb-count" id="lbCount"></span>
        <button class="lb-btn" id="lbPrev" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="lb-btn" id="lbNext" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="lb-btn" id="lbClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </div>
</div>

<footer class="foot" id="foot"></footer>

<script src="assets/metro-data.js"></script>
<script>
/* SECTION: app-state */
const DATA = window.METRO_DATA || { networkNote:'', lines:[] };
const state = { lineId: (DATA.lines[0]||{}).id, kind: '全部', q: '', lb: { list: [], idx: 0 } };

const el = id => document.getElementById(id);
const linesEl = el('lines'), stageEl = el('stage');

function textOf(l){ return (l.name + ' ' + (l.brief||'') + ' ' + l.kind + ' ' + (l.photos||[]).map(p=>p.caption).join(' ')); }

/* SECTION: visible-lines */
function visibleLines(){
  const q = state.q.trim().toLowerCase();
  return DATA.lines.filter(l => {
    if (state.kind !== '全部' && l.kind !== state.kind) return false;
    if (!q) return true;
    const hay = (l.name + (l.brief||'') + l.kind).toLowerCase().replace(/\s+/g,'');
    return hay.includes(q.replace(/\s+/g,''));
  });
}

/* SECTION: stats */
function renderStats(){
  const totalPhotos = DATA.lines.reduce((s,l)=>s+(l.photos||[]).length,0);
  el('stats').innerHTML = [
    `<span class="stat"><b>${DATA.lines.length}</b>条线路可选</span>`,
    `<span class="stat"><b>${totalPhotos}</b>张实拍照片</span>`,
    `<span class="stat">${DATA.networkNote}</span>`
  ].join('');
}

/* SECTION: filters */
function renderFilters(){
  const kinds = ['全部', ...new Set(DATA.lines.map(l=>l.kind))];
  el('filters').innerHTML = kinds.map(k =>
    `<button class="chip${k===state.kind?' on':''}" data-kind="${k}">${k}</button>`).join('');
}
el('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-kind]'); if(!b) return;
  state.kind = b.dataset.kind;
  const keep = visibleLines().some(l=>l.id===state.lineId);
  if(!keep) state.lineId = (visibleLines()[0]||{}).id;
  renderFilters(); renderLines(); renderStage();
});

/* SECTION: line nav */
function renderLines(){
  const list = visibleLines();
  if(!list.length){ linesEl.innerHTML = '<p class="nav-label">没有匹配的线路</p>'; return; }
  linesEl.innerHTML = list.map(l => `
    <button class="line-btn${l.id===state.lineId?' on':''}" data-primary-action="switch-line" data-id="${l.id}"
      style="--c:${l.color};--badge-ink:${l.onDark?'#fff':'#141a22'}" aria-pressed="${l.id===state.lineId}">
      <span class="badge">${l.name.replace(/号线|线$/,'')||l.name}</span>
      <span>${l.name}</span>
      <span class="n">${(l.photos||[]).length}</span>
    </button>`).join('');
}
linesEl.addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  state.lineId = b.dataset.id;
  renderLines(); renderStage();
  window.scrollTo({ top: Math.max(0, stageEl.offsetTop - 20), behavior:'smooth' });
});

/* SECTION: gallery render */
function renderStage(){
  const l = DATA.lines.find(x=>x.id===state.lineId);
  if(!l || !(l.photos||[]).length){
    stageEl.innerHTML = `<div class="empty"><h3>这条线路暂无照片</h3>
      <p>换个筛选条件，或从上方选择其他线路。</p></div>`;
    return;
  }
  stageEl.innerHTML = `
    <div class="line-head">
      <span class="rule" style="background:${l.color}"></span>
      <div>
        <h2>${l.name}</h2>
        <p class="brief">${l.brief||''}</p>
      </div>
      <span class="kind">${l.kind} · ${(l.photos||[]).length} 张</span>
    </div>
    <div class="grid">
      ${l.photos.map((p,i)=>`
        <figure class="card" data-primary-action="view-photo" data-i="${i}" tabindex="0" role="button"
          aria-label="放大查看：${l.name} ${p.caption}" style="margin:0">
          <div class="shot" style="--c:${l.color}">
            <span class="tag">${l.name}</span>
            <img data-image="${p.url}" alt="北京地铁${l.name} ${p.caption}" loading="lazy">
            <span class="fallback">图片暂时无法加载<br>${p.caption}</span>
          </div>
          <figcaption class="cap"><span class="t">${p.caption}</span><span class="s">${p.source}</span></figcaption>
        </figure>`).join('')}
    </div>`;
  hydrateImages(stageEl, l);
}

/* SECTION: image loading */
function hydrateImages(container){
  container.querySelectorAll('img[data-image]').forEach(img => {
    const url = img.dataset.image;
    img.addEventListener('load', () => img.classList.add('ready'), { once:true });
    img.addEventListener('error', () => {
      const shot = img.closest('.shot'); if(shot) shot.classList.add('failed');
    }, { once:true });
    img.src = url;
  });
}

/* SECTION: lightbox */
const lb = el('lb');
function openLb(i){
  const l = DATA.lines.find(x=>x.id===state.lineId); if(!l) return;
  state.lb.list = l.photos; state.lb.line = l; state.lb.idx = i;
  paintLb(); lb.classList.add('open'); document.body.style.overflow='hidden';
}
function paintLb(){
  const l = state.lb.line, p = l.photos[state.lb.idx];
  const img = el('lbImg');
  img.classList.remove('ready');
  img.alt = `北京地铁${l.name} ${p.caption}`;
  img.src = p.url;
  el('lbDot').style.background = l.color;
  el('lbLine').textContent = l.name;
  el('lbCap').textContent = `${p.caption} · 来源 ${p.source}`;
  el('lbCount').textContent = `${state.lb.idx+1} / ${l.photos.length}`;
}
function closeLb(){ lb.classList.remove('open'); document.body.style.overflow=''; }
function step(d){
  const n = state.lb.list.length; if(!n) return;
  state.lb.idx = (state.lb.idx + d + n) % n; paintLb();
}
stageEl.addEventListener('click', e => {
  const c = e.target.closest('.card'); if(c) openLb(+c.dataset.i);
});
stageEl.addEventListener('keydown', e => {
  const c = e.target.closest('.card'); if(!c) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openLb(+c.dataset.i); }
});
el('lbPrev').onclick = () => step(-1);
el('lbNext').onclick = () => step(1);
el('lbClose').onclick = closeLb;
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});

/* SECTION: search */
el('q').addEventListener('input', e => {
  state.q = e.target.value;
  const list = visibleLines();
  if(!list.some(l=>l.id===state.lineId)) state.lineId = (list[0]||{}).id;
  renderLines(); renderStage();
});

/* SECTION: boot */
function boot(){
  renderStats(); renderFilters(); renderLines(); renderStage();
  el('foot').innerHTML =
    `线路标志色依据北京地铁官方线路标识色整理。照片来自网络公开素材（${DATA.lines.length} 条线路共 ${DATA.lines.reduce((s,l)=>s+l.photos.length,0)} 张），` +
    `画面内容为拍摄时的车站或列车场景，具体线路归属以站内标识为准；若某张图片加载失败，卡片会自动显示文字说明而不留空白。`;
}
boot();
</script>
</body>
</html>
